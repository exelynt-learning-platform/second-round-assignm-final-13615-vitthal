# Application
spring.application.name=ecommerce-platform
server.port=8080

# Database (H2 for development)
spring.datasource.url=jdbc:h2:mem:ecommercedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=dbUserName
spring.datasource.password=dbPassword
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=ecommerceSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm12345
app.jwt.expiration=86400000

# Stripe Configuration (replace with real keys)
stripe.api.key=Stripe_Secrete_key
stripe.webhook.secret=Webhook_Secret

# Logging
logging.level.com.ecommerce=INFO
logging.level.org.springframework.security=WARN
